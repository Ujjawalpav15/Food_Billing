name: food_billing
description: "Offline Mess Billing Manager for small hostel messes and food shops in Nepal."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local database
  hive_ce: ^2.9.0
  hive_ce_flutter: ^2.2.0

  # State management
  provider: ^6.1.2

  # Unique IDs
  uuid: ^4.5.1

  # Date & number formatting
  intl: ^0.19.0

  # PDF generation
  pdf: ^3.11.1
  printing: ^5.13.1

  # File sharing
  share_plus: ^10.1.4

  # File system
  path_provider: ^2.1.4

  # Image picker for shop logo
  image_picker: ^1.1.2

  # File picker for backup restore
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation for Hive TypeAdapters
  hive_ce_generator: ^1.8.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
